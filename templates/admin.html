<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Кабинет администратора | Музыкальная школа</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    .btn.no-hover:hover {
      color: inherit;
      background-color: inherit;
      border-color: inherit;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Электронный дневник</a>
    <div class="d-flex align-items-center gap-2">
      <div class="dropdown">
        <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
          {{ current_user.role|capitalize }}
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="#">Ученик</a></li>
          <li><a class="dropdown-item" href="#">Учитель</a></li>
          <li><a class="dropdown-item" href="#">Администратор</a></li>
        </ul>
      </div>

      <div class="dropdown">
        <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
          {{ current_user.name }}
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="/logout">Сменить пользователя</a></li>
        </ul>
      </div>

      <button class="btn btn-outline-light" id="toggle-theme">🌙</button>
    </div>
  </div>
</nav>

<div class="container my-4">
  <h2>Административная панель</h2>
  <ul class="list-group">
    <li class="list-group-item"><a href="/admin/users" class="text-decoration-none">👥 Управление пользователями</a></li>
    <li class="list-group-item"><a href="/admin/schedule" class="text-decoration-none">📅 Управление расписанием</a></li>
    <li class="list-group-item"><a href="/admin/courses" class="text-decoration-none">🎼 Управление предметами</a></li>
    <li class="list-group-item"><a href="/admin/statistics" class="text-decoration-none">📊 Статистика успеваемости</a></li>
  </ul>
</div>
<script>
  const toggleBtn = document.getElementById('toggle-theme');
  toggleBtn.addEventListener('click', () => {
    const html = document.documentElement;
    const currentTheme = html.getAttribute('data-bs-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-bs-theme', newTheme);
    toggleBtn.textContent = newTheme === 'dark' ? '🌙' : '☀️';

    // Переключение таблиц
    document.querySelectorAll('.theme-table').forEach(table => {
      table.classList.remove('table-dark', 'table-light');
      table.classList.add(newTheme === 'dark' ? 'table-dark' : 'table-light');
    });

    // Переключение кнопок дней недели
    document.querySelectorAll('.theme-button').forEach(btn => {
      btn.classList.remove('btn-outline-light', 'btn-outline-dark');
      btn.classList.add(newTheme === 'dark' ? 'btn-outline-light' : 'btn-outline-dark');
    });
  });

  // Инициализация по текущей теме
  document.addEventListener('DOMContentLoaded', () => {
    const theme = document.documentElement.getAttribute('data-bs-theme');

    document.querySelectorAll('.theme-table').forEach(table => {
      table.classList.add(theme === 'dark' ? 'table-dark' : 'table-light');
    });

    document.querySelectorAll('.theme-button').forEach(btn => {
      btn.classList.add(theme === 'dark' ? 'btn-outline-light' : 'btn-outline-dark');
    });
  });
</script>
</body>
</html>
