<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <title>Вход | Музыкальная школа</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: url('') no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 0;
    }

    .login-container {
      position: relative;
      z-index: 1;
    }
  </style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

  <div class="overlay"></div>

  <div class="card p-4 shadow rounded-4 login-container bg-dark text-white" style="min-width: 300px; max-width: 400px;">
    <h3 class="text-center mb-4">Вход в систему</h3>
    {% if error %}
    <div class="alert alert-danger" role="alert">
      {{ error }}
    </div>
    {% endif %}
    <form method="POST" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label for="username" class="form-label">Логин</label>
        <input type="text" class="form-control" id="username" name="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Пароль</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Войти</button>
    </form>
    <div class="text-center mt-3">
      <a href="{{ url_for('index') }}" class="btn btn-secondary w-100">Назад на главную</a>
    </div>
  </div>

</body>

</html>
