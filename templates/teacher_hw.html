<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Домашнее задание | Учитель</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body.light-mode {
      background-color: #f8f9fa !important;
      color: #212529 !important;
    }
    body.dark-mode {
      background-color: #212529 !important;
      color: #f8f9fa !important;
    }
    .theme-card.light-mode {
      background-color: #ffffff !important;
      color: #212529 !important;
    }
    .theme-card.dark-mode {
      background-color: #343a40 !important;
      color: #f8f9fa !important;
    }
    textarea {
      resize: vertical;
    }
  </style>
</head>
<body class="dark-mode">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Электронный дневник</a>
      <div class="d-flex align-items-center gap-2">
        <div class="dropdown">
            <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
              {{ current_user.role|capitalize }}
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#">Ученик</a></li>
              <li><a class="dropdown-item" href="#">Учитель</a></li>
              <li><a class="dropdown-item" href="#">Администратор</a></li>
            </ul>
          </div>

          <div class="dropdown">
            <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
              {{ current_user.name }}
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="/logout">Сменить пользователя</a></li>
            </ul>
          </div>

          <button class="btn btn-outline-light" id="toggle-theme">🌙</button>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="card shadow rounded-4 p-4 theme-card dark-mode">
      <h3 class="mb-4">Задать домашнее задание</h3>

      <form method="post" enctype="multipart/form-data">
        <div class="mb-3">
          <label for="group" class="form-label">Группа</label>
          <select class="form-select" id="group" name="group" required>
            <option value="" disabled selected>Выберите группу</option>
            {% for group in groups %}
              <option value="{{ group }}">{{ group }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label for="homework" class="form-label">Домашнее задание</label>
          <textarea class="form-control" id="homework" name="homework" rows="5" placeholder="Введите текст задания..." required></textarea>
        </div>

        <div class="mb-4">
          <label for="file" class="form-label">Файл (необязательно)</label>
          <input class="form-control" type="file" id="file" name="file">
        </div>

        <button type="submit" class="btn btn-success">Отправить задание</button>
      </form>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById('toggle-theme');
    const html = document.documentElement;
    const body = document.body;
    const card = document.querySelector('.theme-card');

    toggleBtn.addEventListener('click', () => {
      const currentTheme = html.getAttribute('data-bs-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

      html.setAttribute('data-bs-theme', newTheme);
      toggleBtn.textContent = newTheme === 'dark' ? '🌙' : '☀️';

      body.classList.toggle('dark-mode', newTheme === 'dark');
      body.classList.toggle('light-mode', newTheme === 'light');
      card.classList.toggle('dark-mode', newTheme === 'dark');
      card.classList.toggle('light-mode', newTheme === 'light');
    });
  </script>
</body>
</html>
