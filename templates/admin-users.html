<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Кабинет ученика | Музыкальная школа</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    .btn.no-hover:hover {
      color: inherit;
      background-color: inherit;
      border-color: inherit;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <div class="dropdown">
      <button class="navbar-brand btn btn-link text-white dropdown-toggle no-hover" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        Электронный дневник
      </button>
      <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="/student/homework">📊 Статистика успеваемости</a></li>
        <li><a class="dropdown-item" href="/student/homework">🎼 Управление предметами</a></li>
        <li><a class="dropdown-item" href="/student/homework">📅 Управление расписанием</a></li>
      </ul>
    </div>

    <div class="d-flex align-items-center gap-2 ms-auto">
      <div class="dropdown">
        <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
          {{ current_user.role|capitalize }}
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="#">Ученик</a></li>
          <li><a class="dropdown-item" href="#">Учитель</a></li>
          <li><a class="dropdown-item" href="#">Администратор</a></li>
        </ul>
      </div>

      <div class="dropdown">
        <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
          {{ current_user.name }}
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="/logout">Сменить пользователя</a></li>
        </ul>
      </div>

      <button class="btn btn-outline-light" id="toggle-theme">🌙</button>
    </div>
  </div>
</nav>

<div class="container my-4">
  <h2 class="mb-4">Управление пользователями</h2>

  <form class="row g-3 mb-4" method="POST" action="/admin/users/add">
    <div class="col-md-4">
      <input type="text" class="form-control" name="name" placeholder="Имя пользователя" required>
    </div>
    <div class="col-md-3">
      <input type="email" class="form-control" name="email" placeholder="Email" required>
    </div>
    <div class="col-md-3">
      <select class="form-select" name="role" required>
        <option value="">Роль</option>
        <option value="student">Ученик</option>
        <option value="teacher">Преподаватель</option>
        <option value="admin">Администратор</option>
      </select>
    </div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-success w-100">Добавить</button>
    </div>
  </form>

  <table class="table table-striped table-bordered theme-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Роль</th>
        <th>Email</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="cell-id">1</td>
        <td class="cell-name">Иванов И.И.</td>
        <td class="cell-role">Преподаватель</td>
        <td class="cell-email">ivanov@example.com</td>
        <td>
          <button class="btn btn-sm btn-warning btn-toggle-edit">Редактировать</button>
          <a href="/admin/users/delete/1" class="btn btn-sm btn-danger">Удалить</a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<script>
  const toggleBtn = document.getElementById('toggle-theme');
  toggleBtn.addEventListener('click', () => {
    const html = document.documentElement;
    const currentTheme = html.getAttribute('data-bs-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-bs-theme', newTheme);
    toggleBtn.textContent = newTheme === 'dark' ? '🌙' : '☀️';

    // Переключение таблиц
    document.querySelectorAll('.theme-table').forEach(table => {
      table.classList.remove('table-dark', 'table-light');
      table.classList.add(newTheme === 'dark' ? 'table-dark' : 'table-light');
    });

    // Переключение кнопок дней недели
    document.querySelectorAll('.theme-table').forEach(table => {
      table.classList.remove('table-dark', 'table-light');
      table.classList.add(newTheme === 'dark' ? 'table-dark' : 'table-light');
    });

  // Инициализация по текущей теме
  document.addEventListener('DOMContentLoaded', () => {
    const theme = document.documentElement.getAttribute('data-bs-theme');

    document.querySelectorAll('.theme-table').forEach(table => {
      table.classList.add(theme === 'dark' ? 'table-dark' : 'table-light');
    });
  });

    document.querySelectorAll('.theme-table').forEach(table => {
      table.classList.add(theme === 'dark' ? 'table-dark' : 'table-light');
    });

    document.querySelectorAll('.theme-button').forEach(btn => {
      btn.classList.add(theme === 'dark' ? 'btn-outline-light' : 'btn-outline-dark');
    });
  });
</script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.btn-toggle-edit').forEach(button => {
      button.addEventListener('click', function () {
        const row = this.closest('tr');
        const isEditing = row.classList.toggle('editing');

        if (isEditing) {
          // Сохраняем оригинальный текст
          row.dataset.originalName = row.querySelector('.cell-name').textContent;
          row.dataset.originalRole = row.querySelector('.cell-role').textContent;
          row.dataset.originalEmail = row.querySelector('.cell-email').textContent;

          // Преобразуем в инпуты
          row.querySelector('.cell-name').innerHTML = `<input class="form-control" value="${row.dataset.originalName}">`;
          row.querySelector('.cell-role').innerHTML = `
            <select class="form-select">
              <option ${row.dataset.originalRole === 'Ученик' ? 'selected' : ''}>Ученик</option>
              <option ${row.dataset.originalRole === 'Преподаватель' ? 'selected' : ''}>Преподаватель</option>
              <option ${row.dataset.originalRole === 'Администратор' ? 'selected' : ''}>Администратор</option>
            </select>`;
          row.querySelector('.cell-email').innerHTML = `<input class="form-control" value="${row.dataset.originalEmail}">`;
          this.textContent = 'Сохранить';
          this.classList.remove('btn-warning');
          this.classList.add('btn-success');
        } else {
          // Чтение новых значений
          const newName = row.querySelector('.cell-name input').value;
          const newRole = row.querySelector('.cell-role select').value;
          const newEmail = row.querySelector('.cell-email input').value;

          // Отправить на сервер здесь, если нужно

          // Отображение как обычный текст
          row.querySelector('.cell-name').textContent = newName;
          row.querySelector('.cell-role').textContent = newRole;
          row.querySelector('.cell-email').textContent = newEmail;
          this.textContent = 'Редактировать';
          this.classList.remove('btn-success');
          this.classList.add('btn-warning');
        }
      });
    });
  });
</script>
</body>
</html>
