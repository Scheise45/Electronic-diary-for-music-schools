<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Электронный дневник{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid d-flex justify-content-between">
            <a class="navbar-brand" href="#">Музыкальная школа</a>
            <button class="btn btn-outline-light" onclick="toggleDarkMode()">🌙 / ☀️</button>
        </div>
    </nav>

    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>

    <script>
        function toggleDarkMode() {
            const body = document.body;
            const navbar = document.querySelector('.navbar');

            body.classList.toggle('dark-mode');

            // Меняем только фон у navbar, а не текст (оставим .navbar-dark)
            if (body.classList.contains('dark-mode')) {
                navbar.classList.remove('bg-primary');
                navbar.classList.add('bg-dark');
            } else {
                navbar.classList.remove('bg-dark');
                navbar.classList.add('bg-primary');
            }
        }
    </script>

</body>

</html>
